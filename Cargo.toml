[package]
name = "default_pipelines_plugin"
version = "0.1.0"
edition = "2024"
publish = false
description = "Default Pipelines (`pulsar.default_pipelines`): the render pipelines the engine ships, as .rendergraph assets in the plugin's folder, made from Helio's presets for the enabled plugins"

[features]
# The plugin as a library of its own, loaded by the editor from plugins/editor:
# cargo build -p <this package> --release --features dll
dll = ["editor", "dep:plugin_editor_api", "plugin_editor_api/editor", "plugin_editor_api/shared-dylibs"]
# The editor's registrations: none (the files and the id migration are the
# game's too). Present because every installed root has it.
editor = []

[dependencies]
# The plugin library's editor plugin entry point (feature `dll`).
plugin_editor_api = { workspace = true, optional = true }
# The plugin gate and the builder its registrations go through.
pulsar_plugins = { workspace = true }
# The plugin's folder (`plugins/pulsar.default_pipelines/`).
engine_fs = { workspace = true }
# The engine's render seams: the enabled plugins' features (the nodes the
# graphs are made of) and the pipeline-id migration.
engine_backend = { path = "../../../crates/core/engine_backend", default-features = false, features = ["render"] }
# The presets the files are made from, and the graph asset format.
helio-presets = { workspace = true }
helio-graph-asset = { workspace = true }
helio-frame-api = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
pollster = "=0.4.0"
helio = { workspace = true }
helio-core = { workspace = true }
wgpu = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

# Also the plugin as a library of its own (feature `dll`, loaded by the editor).
[lib]
crate-type = ["cdylib", "rlib"]
